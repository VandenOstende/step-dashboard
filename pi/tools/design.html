<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Step Dashboard — designomgeving</title>
<style>
  :root{
    --bg:#12141c; --panel:#191c26; --line:#272b39; --text:#e6e8f0;
    --dim:#8b91a6; --accent:#9184d9; --warn:#e0a94a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:baseline;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
  header .sub{color:var(--dim);font-size:13px}
  header .sub code{font-family:var(--mono);font-size:12px}

  main{display:flex;gap:22px;align-items:flex-start;padding:20px;flex-wrap:wrap}

  /* het schermpje */
  .stage{flex:none}
  /* content-box, anders eet de rand 20 px van het scherm op en is de onderste
     rij van het toetsenbord weg. Het frame moet exact 480 × 320 blijven. */
  .bezel{box-sizing:content-box;width:calc(var(--w) * var(--z));height:calc(var(--h) * var(--z));
    padding:0;border:10px solid #0a0b10;border-radius:14px;overflow:hidden;
    box-shadow:0 14px 40px rgba(0,0,0,.55);background:#000}
  .bezel iframe{width:var(--w);height:var(--h);border:0;display:block;
    transform:scale(var(--z));transform-origin:0 0}
  .stage .caption{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--dim);font-size:12px}

  /* bediening */
  .side{flex:1;min-width:340px;max-width:520px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card h2{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  button{font:inherit;color:var(--text);background:#20242f;border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{border-color:var(--accent);color:var(--accent)}
  button.ghost{background:transparent}

  .row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .row label{flex:none;width:112px;color:var(--dim);font-size:13px}
  .row input[type=range]{flex:1;accent-color:var(--accent)}
  .row .val{flex:none;width:64px;text-align:right;font-family:var(--mono);font-size:12px}
  .toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
  .toggles label{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer}
  .toggles input{accent-color:var(--accent)}
  select{font:inherit;color:var(--text);background:#20242f;border:1px solid var(--line);
    border-radius:7px;padding:5px 8px}

  #log{margin:0;max-height:150px;overflow:auto;font-family:var(--mono);font-size:11.5px;
    line-height:1.6;color:var(--dim);white-space:pre-wrap}
  .hint{color:var(--dim);font-size:12px;margin:10px 0 0}
  .hint b{color:var(--text);font-weight:600}
</style>
</head>
<body>

<header>
  <h1>Step Dashboard — designomgeving</h1>
  <span class="sub">de echte UI op <code>480 × 320</code>, nagemaakte hardware</span>
</header>

<main>
  <div class="stage">
    <div class="bezel" id="bezel" style="--z:1;--w:480px;--h:320px"><iframe id="ui" src="/" title="dashboard"></iframe></div>
    <div class="caption">
      <button id="lay-l" class="on">Liggend</button>
      <button id="lay-p">Staand</button>
      <button id="lay-pr" title="Staande UI op het liggende paneel van de Pi">Staand op 480 × 320</button>
      <span style="width:10px"></span>
      <button id="z1" class="on">1×</button>
      <button id="z2">2×</button>
      <button id="reload" class="ghost">Herladen</button>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="autoreload" checked> herlaad bij opslaan
      </label>
      <span id="saved"></span>
    </div>
  </div>

  <div class="side">

    <div class="card">
      <h2>Scherm</h2>
      <div class="chips" id="screens"></div>
      <p class="hint">Deze knoppen roepen de functies in de pagina rechtstreeks aan, dus je
        ziet precies wat een tik op het schermpje ook zou doen.</p>
    </div>

    <div class="card">
      <h2>Situatie</h2>
      <div class="chips" id="presets"></div>
    </div>

    <div class="card">
      <h2>Waarden</h2>
      <div id="sliders"></div>
      <div class="row">
        <label>Storing</label>
        <select id="fault">
          <option value="">geen</option>
          <option>OVER_TEMP_FET</option>
          <option>OVER_TEMP_MOTOR</option>
          <option>ABS_OVER_CURRENT</option>
          <option>UNDER_VOLTAGE</option>
          <option>DRV</option>
        </select>
        <label style="width:auto;margin-left:14px">Thema</label>
        <select id="theme">
          <option>Auto</option><option>Licht</option><option>Donker</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2>Aan of uit</h2>
      <div class="toggles" id="toggles"></div>
    </div>

    <div class="card">
      <h2>Wat de UI heeft gestuurd</h2>
      <pre id="log">—</pre>
    </div>

  </div>
</main>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var frame = $("ui");
var W = function () { return frame.contentWindow; };
var state = null;

/* ── schuiven ───────────────────────────────────────────────────────────── */
var SLIDERS = [
  { k: "speed", l: "Snelheid", min: 0, max: 60, step: 1, u: " km/u" },
  { k: "battery", l: "Accu", min: 0, max: 100, step: 1, u: " %" },
  { k: "duty", l: "Duty", min: 0, max: 100, step: 1, u: " %" },
  { k: "tempMotor", l: "Motor", min: 0, max: 130, step: 1, u: " °C" },
  { k: "tempFet", l: "FET's", min: 0, max: 130, step: 1, u: " °C" },
  { k: "motorCurrent", l: "Motorstroom", min: 0, max: 150, step: 1, u: " A" },
  { k: "batteryCurrent", l: "Accustroom", min: -20, max: 80, step: 1, u: " A" },
  { k: "tripKm", l: "Rit", min: 0, max: 60, step: 0.1, u: " km" },
  { k: "whUsed", l: "Verbruik", min: 0, max: 900, step: 5, u: " Wh" },
  { k: "chargeEta", l: "Laadtijd", min: 0, max: 300, step: 5, u: " min" }
];

var TOGGLES = [
  { k: "connected", l: "VESC verbonden" },
  { k: "animate", l: "Snelheid laten golven" },
  { k: "charging", l: "Aan de lader" },
  { k: "wifi.connected", l: "Wi-Fi verbonden" },
  { k: "bt.connected", l: "Bluetooth verbonden" },
  { k: "modem.present", l: "5G-dongle aanwezig" },
  { k: "weather.ok", l: "Weer bereikbaar" },
  { k: "update.available", l: "Update beschikbaar" }
];

/* ── schermen ───────────────────────────────────────────────────────────── */
var SCREENS = [
  ["Rit", function (w) { closeAll(w); w.show(0); }],
  ["Motor", function (w) { closeAll(w); w.show(1); }],
  ["Accu", function (w) { closeAll(w); w.show(2); }],
  ["Systeem", function (w) { closeAll(w); w.openSys(); }],
  ["Wi-Fi", function (w) { closeAll(w); w.openNet("wifi"); }],
  ["Bluetooth", function (w) { closeAll(w); w.openNet("bt"); }],
  ["Instellingen", function (w) {
    closeAll(w); w.renderSettings();
    w.document.getElementById("settings").classList.add("on"); w.syncNav("setlist");
  }],
  ["Meldingen", function (w) {
    closeAll(w); w.renderNotices();
    w.document.getElementById("notices").classList.add("on"); w.syncNav("noticelist");
  }],
  ["Toetsenbord", function (w) {
    closeAll(w);
    w.openKeyboard({ title: "Huisnet-5G", confirm: "Verbind", onDone: function () {} });
  }],
  ["Aan/uit", function (w) { closeAll(w); w.openPower(); }],
  ["Alles dicht", closeAll]
];

function closeAll(w) {
  ["sys", "settings", "net", "notices", "kbd", "power", "alarm"].forEach(function (id) {
    var el = w.document.getElementById(id);
    if (el) el.classList.remove("on");
  });
}

/* ── bouwen ─────────────────────────────────────────────────────────────── */
function get(obj, path) {
  return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
}
function patchFor(path, value) {
  var parts = path.split(".");
  var out = {}, cur = out;
  for (var i = 0; i < parts.length - 1; i++) { cur[parts[i]] = {}; cur = cur[parts[i]]; }
  cur[parts[parts.length - 1]] = value;
  return out;
}

function post(payload) {
  return fetch("/design/state", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); }).then(function (j) { state = j.state; });
}

function buildSliders() {
  $("sliders").innerHTML = SLIDERS.map(function (s) {
    return '<div class="row"><label>' + s.l + '</label>'
      + '<input type="range" data-k="' + s.k + '" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '">'
      + '<span class="val" data-v="' + s.k + '"></span></div>';
  }).join("");
  [].forEach.call($("sliders").querySelectorAll("input"), function (inp) {
    inp.addEventListener("input", function () {
      var k = inp.dataset.k;
      var v = parseFloat(inp.value);
      state[k] = v;
      showSlider(k);
      post({ patch: patchFor(k, v) });
    });
  });
}

function showSlider(k) {
  var s = SLIDERS.filter(function (x) { return x.k === k; })[0];
  var v = state[k];
  $("sliders").querySelector('[data-k="' + k + '"]').value = v;
  $("sliders").querySelector('[data-v="' + k + '"]').textContent =
    (s.step < 1 ? v.toFixed(1) : Math.round(v)) + s.u;
}

function buildToggles() {
  $("toggles").innerHTML = TOGGLES.map(function (t) {
    return '<label><input type="checkbox" data-k="' + t.k + '"> ' + t.l + "</label>";
  }).join("");
  [].forEach.call($("toggles").querySelectorAll("input"), function (inp) {
    inp.addEventListener("change", function () {
      post({ patch: patchFor(inp.dataset.k, inp.checked) });
    });
  });
}

function buildScreens() {
  $("screens").innerHTML = "";
  SCREENS.forEach(function (s) {
    var b = document.createElement("button");
    b.textContent = s[0];
    b.addEventListener("click", function () {
      try { s[1](W()); } catch (err) { alert("lukt niet: " + err.message); }
    });
    $("screens").appendChild(b);
  });
}

function buildPresets(names) {
  $("presets").innerHTML = "";
  names.forEach(function (n) {
    var b = document.createElement("button");
    b.textContent = n;
    b.addEventListener("click", function () { post({ preset: n }).then(paint); });
    $("presets").appendChild(b);
  });
  var r = document.createElement("button");
  r.className = "ghost";
  r.textContent = "beginstand";
  r.addEventListener("click", function () { post({ reset: true }).then(paint); });
  $("presets").appendChild(r);
}

function paint() {
  SLIDERS.forEach(function (s) { showSlider(s.k); });
  TOGGLES.forEach(function (t) {
    $("toggles").querySelector('[data-k="' + t.k + '"]').checked = !!get(state, t.k);
  });
  $("fault").value = state.fault || "";
  $("theme").value = state.theme;
}

/* ── thema meteen doorzetten ────────────────────────────────────────────── */
$("theme").addEventListener("change", function () {
  var v = $("theme").value;
  state.theme = v;
  post({ patch: { theme: v } });
  try { W().cfg.theme = v; W().applyTheme(true); } catch (e) { /* nog aan het laden */ }
});
$("fault").addEventListener("change", function () {
  post({ patch: { fault: $("fault").value || null } });
});

/* ── zoom en herladen ───────────────────────────────────────────────────── */
/* Van indeling wisselen is: eerst de instelling bijstellen, dan de andere
   pagina laden. De pagina kijkt bij het opstarten of hij de goede is, dus
   zonder die eerste stap stuurt hij zichzelf meteen terug. */
/* Drie standen, want de derde is wat er op de step gebeurt: de staande UI op
   een paneel dat fysiek liggend is. De pagina draait zichzelf dan een
   kwartslag. Zonder deze knop zie je dat pas op het stuur. */
var opPaneel = false;

function paintLayout(name) {
  var port = name === "Staand" && !opPaneel;
  $("bezel").style.setProperty("--w", port ? "320px" : "480px");
  $("bezel").style.setProperty("--h", port ? "480px" : "320px");
  $("lay-l").classList.toggle("on", name !== "Staand");
  $("lay-p").classList.toggle("on", name === "Staand" && !opPaneel);
  $("lay-pr").classList.toggle("on", name === "Staand" && opPaneel);
}

function setLayout(name, paneel) {
  if (!state) return;
  opPaneel = !!paneel;
  state.layout = name;
  paintLayout(name);
  post({ patch: { layout: name } }).then(function () {
    frame.src = name === "Staand" ? "/portrait.html" : "/index.html";
  });
}
$("lay-l").addEventListener("click", function () { setLayout("Liggend", false); });
$("lay-p").addEventListener("click", function () { setLayout("Staand", false); });
$("lay-pr").addEventListener("click", function () { setLayout("Staand", true); });

function zoom(z) {
  $("bezel").style.setProperty("--z", z);
  $("z1").classList.toggle("on", z === 1);
  $("z2").classList.toggle("on", z === 2);
}
$("z1").addEventListener("click", function () { zoom(1); });
$("z2").addEventListener("click", function () { zoom(2); });
$("reload").addEventListener("click", function () { frame.contentWindow.location.reload(); });

/* Opslaan in de editor = herladen in het frame. Dat scheelt de hele dag
   heen-en-weer klikken. */
var lastMtime = 0;
setInterval(function () {
  fetch("/design/mtime", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) {
      if (!lastMtime) { lastMtime = j.mtime; return; }
      if (j.mtime === lastMtime) return;
      lastMtime = j.mtime;
      $("saved").textContent = "opgeslagen " + new Date().toTimeString().slice(0, 8);
      if ($("autoreload").checked) frame.contentWindow.location.reload();
    })["catch"](function () {});
}, 700);

/* ── log ────────────────────────────────────────────────────────────────── */
setInterval(function () {
  fetch("/design/state", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) {
      $("log").textContent = j.log.length ? j.log.join("\n") : "—";
      /* Wissel je van indeling in de UI zelf, dan groeit het frame mee. */
      if (state && j.state.layout !== state.layout) {
        state.layout = j.state.layout;
        paintLayout(state.layout);
      }
    })["catch"](function () {});
}, 1500);

/* ── start ──────────────────────────────────────────────────────────────── */
fetch("/design/state").then(function (r) { return r.json(); }).then(function (j) {
  state = j.state;
  buildSliders();
  buildToggles();
  buildScreens();
  buildPresets(j.presets);
  paint();
  paintLayout(state.layout);
});
</script>
</body>
</html>
